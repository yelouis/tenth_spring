name: sync_e2e

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  sync-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Memguard doctor
        run: python3 -I tools/memguard.py doctor

      - name: Install Godot 4.3
        run: |
          curl -fsSLO https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          curl -fsSLO https://github.com/godotengine/godot/releases/download/4.3-stable/SHA512-SUMS.txt
          grep " Godot_v4.3-stable_linux.x86_64.zip$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          echo "GODOT_BIN=/usr/local/bin/godot" >> $GITHUB_ENV

      - name: Import Godot project assets
        run: python3 -I tools/godot.py --memguard-step godot_import --import

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to exact local version (Flutter 3.44.6) per agent guide Item 3c
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Companion pub get
        run: flutter pub get
        working-directory: companion

      - name: Companion analyze
        run: flutter analyze
        working-directory: companion

      - name: Companion test suite
        run: python3 -I ../tools/memguard.py run flutter_test -- flutter test
        working-directory: companion

      - name: Cross-language loopback sync
        run: python3 -I tools/memguard.py run sync_e2e -- python3 -I tools/sync_e2e.py

      - name: Demo explore points import
        run: |
          cat << 'EOF' > /tmp/demo_scratch_points.json
          {
            "points": [
              {"lat": 38.8893, "lon": -77.0282},
              {"lat": 38.9096, "lon": -77.0434}
            ],
            "home": {"lat": 38.8800, "lon": -77.1100}
          }
          EOF
          python3 -I tools/demo_import.py --points /tmp/demo_scratch_points.json --demo-dir user://test/demo_ci
          python3 -c "
          import sqlite3, os
          db = os.path.expanduser('~/.local/share/godot/app_userdata/Tenth Spring/test/demo_ci/tenth_spring.db')
          assert os.path.isfile(db), f'Demo DB not found at {db}'
          conn = sqlite3.connect(db)
          c = conn.cursor()
          c.execute(\"SELECT count(*) FROM visit_log WHERE kind='explore';\")
          exp = c.fetchone()[0]
          c.execute(\"SELECT count(*) FROM visit_log WHERE kind='home';\")
          hm = c.fetchone()[0]
          c.execute(\"SELECT count(*) FROM visit_log WHERE lat IS NOT NULL OR lon IS NOT NULL;\")
          coords = c.fetchone()[0]
          assert exp == 2, f'Expected 2 explore rows, got {exp}'
          assert hm == 1, f'Expected 1 home row, got {hm}'
          assert coords == 0, f'Expected 0 non-NULL coordinates, got {coords}'
          print(f'Demo DB verification OK: {exp} explore, {hm} home, {coords} coords')
          "
          rm -f /tmp/demo_scratch_points.json
