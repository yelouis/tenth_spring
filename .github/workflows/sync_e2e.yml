name: sync_e2e

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  sync-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Memguard doctor
        run: python3 -I tools/memguard.py doctor

      - name: Install Godot 4.3
        run: |
          curl -fsSLO https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          curl -fsSLO https://github.com/godotengine/godot/releases/download/4.3-stable/SHA512-SUMS.txt
          grep " Godot_v4.3-stable_linux.x86_64.zip$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import Godot project assets
        run: python3 -I tools/memguard.py run godot_import -- godot --headless --path game --import

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to exact local version (Flutter 3.44.6) per agent guide Item 3c
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Companion pub get
        run: flutter pub get
        working-directory: companion

      - name: Companion analyze
        run: flutter analyze
        working-directory: companion

      - name: Companion test suite
        run: python3 -I ../tools/memguard.py run flutter_test -- flutter test
        working-directory: companion

      - name: Cross-language loopback sync
        run: python3 -I tools/memguard.py run sync_e2e -- python3 -I tools/sync_e2e.py
