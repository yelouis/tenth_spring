name: sync_e2e

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  sync-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Memguard doctor
        run: python3 -I tools/memguard.py doctor

      - name: Install Godot 4.3
        run: |
          curl -fsSLO https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          curl -fsSLO https://github.com/godotengine/godot/releases/download/4.3-stable/SHA512-SUMS.txt
          grep " Godot_v4.3-stable_linux.x86_64.zip$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          echo "GODOT_BIN=/usr/local/bin/godot" >> $GITHUB_ENV

      - name: Import Godot project assets
        run: python3 -I tools/godot.py --memguard-step godot_import --import

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to exact local version (Flutter 3.44.6) per agent guide Item 3c
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Companion pub get
        run: flutter pub get
        working-directory: companion

      - name: Companion analyze
        run: flutter analyze
        working-directory: companion

      - name: Companion test suite
        run: python3 -I ../tools/memguard.py run flutter_test -- flutter test
        working-directory: companion

      - name: Cross-language loopback sync
        run: python3 -I tools/memguard.py run sync_e2e -- python3 -I tools/sync_e2e.py

      - name: Demo GPX import
        run: |
          cp companion/test/fixtures/synthetic_hand_drawn.gpx /tmp/demo_scratch.gpx
          python3 -I tools/memguard.py run demo_import -- python3 -I tools/demo_import.py --gpx /tmp/demo_scratch.gpx
          python3 -c "
          import sqlite3, os
          db = os.path.expanduser('~/.local/share/godot/app_userdata/Tenth Spring/demo/tenth_spring.db')
          assert os.path.isfile(db), f'Demo DB not found at {db}'
          conn = sqlite3.connect(db)
          c = conn.cursor()
          c.execute(\"SELECT count(*) FROM visit_log WHERE kind='visit';\")
          v = c.fetchone()[0]
          c.execute(\"SELECT count(*) FROM visit_log WHERE kind='corridor';\")
          cor = c.fetchone()[0]
          assert v == 1, f'Expected 1 visit, got {v}'
          assert cor == 38, f'Expected 38 corridors, got {cor}'
          print(f'Demo DB verification OK: {v} visit, {cor} corridors')
          "
          rm -f /tmp/demo_scratch.gpx
